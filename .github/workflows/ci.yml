name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use pinned npm version
        run: npm install --global npm@10.8.2

      - name: Install exact dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

  smoke:
    name: Playwright smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use pinned npm version
        run: npm install --global npm@10.8.2

      - name: Install exact dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run homepage smoke test
        run: npx playwright test e2e/home.spec.ts

  audit:
    name: Dependency audit (high and critical)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Use pinned npm version
        run: npm install --global npm@10.8.2

      # npm audit reads package-lock.json; no install needed.
      - name: Fail on unaccepted high or critical advisories
        run: npm run audit:check

  rls:
    name: Database migrations and RLS tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The script starts its own throwaway cluster, so only the server
      # binaries are needed. Install them if the runner image lacks them.
      - name: Ensure PostgreSQL server binaries
        run: |
          if ! ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql
          fi

      - name: Apply migrations and run RLS tests
        run: bash scripts/test-rls.sh

  # The same assertions as the rls job, but against the real Supabase stack
  # (default grants and ACLs, Postgres 17) instead of the local shim.
  rls-supabase:
    name: RLS tests on the local Supabase stack
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.122.0

      - name: Start local Supabase
        run: supabase start

      - name: Run RLS tests
        run: |
          set +e
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -X -v ON_ERROR_STOP=1 -f supabase/tests/rls_alpha_core.sql \
            2> "$RUNNER_TEMP/psql-errors.log"
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error title=RLS tests on Supabase failed::$(tail -n 5 "$RUNNER_TEMP/psql-errors.log" | tr '\n' ' ' | cut -c1-900)"
          fi
          exit "$status"

  e2e-auth:
    name: Playwright sign-in and organizer access
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use pinned npm version
        run: npm install --global npm@10.8.2

      - name: Install exact dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.122.0

      # Inbucket (mail catcher) stays enabled: the tests read the sign-in codes
      # from it. No mail leaves the runner.
      - name: Start local Supabase
        run: supabase start

      - name: Export local connection settings
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          value() { grep -E "^$1=" "$RUNNER_TEMP/supabase.env" | head -1 | cut -d= -f2- | sed -e 's/^"//' -e 's/"$//'; }
          echo "NEXT_PUBLIC_SUPABASE_URL=$(value API_URL)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(value ANON_KEY)" >> "$GITHUB_ENV"
          echo "::add-mask::$(value ANON_KEY)"

      # System mails go to the mail catcher of the local stack, not to a real
      # provider.
      - name: Run sign-in and access tests
        env:
          MAIL_SMTP_HOST: 127.0.0.1
          MAIL_SMTP_PORT: "54325"
          MAIL_FROM: hello@example.test
        run: npx playwright test e2e/auth.spec.ts e2e/profile.spec.ts e2e/approval.spec.ts e2e/event.spec.ts e2e/walkthrough.spec.ts

      # Video of the whole profile flow (e2e/walkthrough.spec.ts), also after a
      # failed run, so that it can be watched under Actions -> run -> Artifacts.
      - name: Upload walkthrough video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ablauf-video
          path: test-results/walkthrough/ablauf.webm
          retention-days: 14
          if-no-files-found: warn
