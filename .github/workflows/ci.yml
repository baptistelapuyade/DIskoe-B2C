name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use pinned npm version
        run: npm install --global npm@10.8.2

      - name: Install exact dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

  smoke:
    name: Playwright smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use pinned npm version
        run: npm install --global npm@10.8.2

      - name: Install exact dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run homepage smoke test
        run: npm run test:e2e

  audit:
    name: Dependency audit (high and critical)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Use pinned npm version
        run: npm install --global npm@10.8.2

      # npm audit reads package-lock.json; no install needed.
      - name: Fail on unaccepted high or critical advisories
        run: npm run audit:check
