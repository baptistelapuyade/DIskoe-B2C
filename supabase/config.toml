project_id = "diskoe-b2c"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
# SMTP port of the mail catcher; the app sends its system mails here in tests.
smtp_port = 54325

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
# Cookies are bound to the host, so both spellings of the local address are allowed.
additional_redirect_urls = ["http://127.0.0.1:3000/**", "http://localhost:3000/**"]
jwt_expiry = 3600
# Open registration: anyone may sign in. Signing in grants no organizer rights;
# those come only from founder provisioning (provision_profile_owner).
enable_signup = true

[auth.rate_limit]
# Local and CI only. The hosted limits are configured in the dashboard.
email_sent = 100
sign_in_sign_ups = 100
token_verifications = 100

[auth.email]
enable_signup = true
enable_confirmations = true
# Local and CI keep one second so that tests can request codes for the same
# address repeatedly. The hosted projects use 60 seconds (set in the dashboard,
# see docs/runbooks/supabase-auth-setup.md); the sign-in screen waits 60 seconds
# before it offers "Send a new code" again.
max_frequency = "1s"
otp_length = 6
# Ten minutes (MAIL-01 says "10 minutes and only once").
otp_expiry = 600

# New users receive the "confirmation" template, returning users "magic_link".
# Both carry the code ({{ .Token }}) and the link ({{ .ConfirmationURL }}).
[auth.email.template.magic_link]
subject = "Your DISKOE sign-in code / Dein DISKOE-Anmeldecode"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "Your DISKOE sign-in code / Dein DISKOE-Anmeldecode"
content_path = "./supabase/templates/confirmation.html"
